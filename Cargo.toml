[package]
name = "replicant-regex"
version = "0.1.0"
edition = "2024"
authors = ["Sujal Bolia"]
description = "Determine regex equivalence and find shortest counterexamples"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nextonesfaster/replicant"
readme = "README.md"
keywords = ["regex", "automata", "equivalence", "cli"]
categories = ["command-line-utilities", "text-processing", "algorithms"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde", "dep:serde_json"]

[[bin]]
name = "vk"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
regex-automata = { version = "0.4", default-features = false, features = [
    "std",
    "syntax",
    "unicode",
    "dfa-build",
    "dfa-search",
] }
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
