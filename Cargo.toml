[package]
name = "replicant-regex"
version = "0.1.0"
edition = "2024"
authors = ["Sujal Bolia"]
description = "Determine regex equivalence and find shortest counterexamples"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nextonesfaster/replicant"
readme = "README.md"
keywords = ["regex", "automata", "equivalence", "cli"]
categories = ["command-line-utilities", "text-processing", "algorithms"]

[[bin]]
name = "vk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "unicode", "dfa-build", "dfa-search"] }
regex-syntax = "0.8"
